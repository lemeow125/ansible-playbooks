steps:
  - name: test backup script
    image: alpine:latest
    environment:
      DEVICE_NAME: "TEST-NODE"
      NTFY_TOPIC: "CI-TEST"
    volumes:
      - /var/cache/apk:/var/cache/apk
    commands:
      - set -e
      # Install required packages (add util-linux for findmnt)
      - apk add --no-cache bash borgbackup curl jq util-linux

      - cd roles/files/debian/setup/scripts
      - chmod +x *.sh

      # Prepare mock .env file
      - |
        [ -f .env.sample ] || { echo "ERROR: .env.sample not found"; exit 1; }
        cp .env.sample .env
        sed -i "s/^device_name=.*/device_name=\"$DEVICE_NAME\"/" .env
        sed -i "s/^ntfy_topic=.*/ntfy_topic=\"$NTFY_TOPIC\"/" .env
        sed -i '/^declare -A mount_points=/,/^)/d' .env
        # Use /dev/shm (already mounted tmpfs) as the backup destination
        echo 'declare -A mount_points=(["shm"]="/dev/shm")' >> .env

      # Create source and backup directories
      - |
        mkdir -p /tmp/source /dev/shm/backup
        echo "Mount status for /dev/shm:"
        findmnt /dev/shm   # verify it's a mount point (should be tmpfs)

      # Create test data
      - |
        mkdir -p /tmp/source/test_data
        echo "Test backup data - $(date)" > /tmp/source/test_data/sample.txt
        ls -la /tmp/

      # Run the backup script (adjust script name if necessary)
      - |
        echo "Running backup script..."
        ./backup.sh

      # Verify backup repository was created under /dev/shm/backup
      - |
        echo "Checking backup repository..."
        borg list /dev/shm/backup/* 2>/dev/null || echo "No repository found (may be normal for first run)"
        ls -la /dev/shm/backup/

      # Cleanup (no umount needed, just remove directories)
      - rm -rf /tmp/source /dev/shm/backup

  - name: discord
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: DISCORD_WEBHOOK_ID
      webhook_token:
        from_secret: DISCORD_WEBHOOK_TOKEN
      message: >
        {{#success build.status}}
          ✅ [{{repo.name}}] Successful test for build #{{build.number}}
          Branch: {{commit.branch}}
          Commit: {{commit.sha}}:{{commit.message}}
          By: {{commit.author}}
        {{else}}
          ❌ [{{repo.name}}] Failed test for build #{{build.number}}
          Branch: {{commit.branch}}
          Commit: {{commit.sha}}:{{commit.message}}
          By: {{commit.author}}
        {{/success}}
    when:
      status: [ success, failure ]

when:
  - branch:
      - master
      - feat/backup-script-automation
    event:
      - push
      - manual