steps:
  - name: test backup script
    image: alpine:latest
    environment:
      DEVICE_NAME: "TEST-NODE"
      NTFY_TOPIC: "CI-TEST"
    volumes:
      - /var/cache/apk:/var/cache/apk
    commands:
      - set -e
      # Install required packages (add util-linux for findmnt)
      - apk add --no-cache bash borgbackup curl jq util-linux

      - cd roles/files/debian/setup/scripts

      # Prepare mock .env file
      - |
        [ -f .env.sample ] || { echo "ERROR: .env.sample not found"; exit 1; }
        cp .env.sample .env
        sed -i "s/^device_name=.*/device_name=\"$DEVICE_NAME\"/" .env
        sed -i "s/^ntfy_topic=.*/ntfy_topic=\"$NTFY_TOPIC\"/" .env
        sed -i '/^declare -A mount_points=/,/^)/d' .env
        echo 'declare -A mount_points=(["tmpfs"]="/tmp/backup")' >> .env

      # Create test directories and mount tmpfs
      - |
        mkdir -p /tmp/source /tmp/backup
        mount -t tmpfs tmpfs /tmp/backup
        echo "Mount status:"
        findmnt /tmp/backup   # verify mount exists

      # Create test data
      - |
        mkdir -p /tmp/source/test_data
        echo "Test backup data - $(date)" > /tmp/source/test_data/sample.txt
        ls -la /tmp/

      # Run the backup script (adjust script name if needed)
      - |
        echo "Running backup script..."
        ./backup.sh

      # Verify backup repository was created
      - |
        echo "Checking backup repository..."
        borg list /tmp/backup/* 2>/dev/null || echo "No repository found (may be normal for first run)"
        ls -la /tmp/backup/

      # Cleanup (unmount tmpfs and remove directories)
      - umount /tmp/backup || true
      - rm -rf /tmp/backup /tmp/source

when:
  - branch:
      - master
      - feat/backup-script-automation
    event:
      - push
      - manual