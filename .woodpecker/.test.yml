steps:
  - name: test backup script
    image: alpine:latest
    environment:
      DEVICE_NAME: "TEST-NODE"
      NTFY_TOPIC: "CI-TEST"
    volumes:
      - /var/cache/apk:/var/cache/apk
    commands:
      - set -e
      - mkdir -p /var/cache/apk && ln -s /var/cache/apk /etc/apk/cache 2>/dev/null || true
      - apk add --no-cache bash borgbackup curl jq

      - cd roles/files/debian/setup/scripts

      # Mock .env
      - |
        [ -f .env.sample ] || { echo "ERROR: .env.sample not found"; exit 1; }
        cp .env.sample .env
        sed -i 's/^device_name=.*/device_name="$DEVICE_NAME"/' .env
        sed -i 's/^ntfy_topic=.*/ntfy_topic="$NTFY_TOPIC"/' .env
        sed -i '/^declare -A mount_points=/,/^)/d' .env
        echo 'declare -A mount_points=(["/tmp/source"]="/tmp/backup")' >> .env

      # Create test data
      - |
        mkdir -p /tmp/backup /tmp/source
        mkdir -p /tmp/source/test_data
        echo "Test backup data - $(date)" > /tmp/source/test_data/sample.txt
        ls -la /tmp/

      - sed -i 's/^[[:space:]]*check_mount.*/true # bypassed in CI/' backup.sh

      # Verify
      - |
        [ -d /tmp/backup ] || { echo "ERROR: Backup directory verification failed"; exit 1; }
        ls -la /tmp/backup

      # Cleanup
      - rm -rf /tmp/backup /tmp/source

  - name: discord
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: DISCORD_WEBHOOK_ID
      webhook_token:
        from_secret: DISCORD_WEBHOOK_TOKEN
      message: >
        {{#success build.status}}
          ✅ [{{repo.name}}] Successful test for build #{{build.number}}
          Branch: {{commit.branch}}
          Commit: {{commit.sha}}:{{commit.message}}
          By: {{commit.author}}
        {{else}}
          ❌ [{{repo.name}}] Failed test for build #{{build.number}}
          Branch: {{commit.branch}}
          Commit: {{commit.sha}}:{{commit.message}}
          By: {{commit.author}}
        {{/success}}
    when:
      status: [ success, failure ]

when:
  - branch:
      - master
      - feat/backup-script-automation
    event:
      - push
      - manual